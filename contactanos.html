<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME - Cuervo</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="IMAGENES HOME/logo-blanco.png" type="image/x-icon">

</head>
<body>

                <a class="enlaces-paginas">Categorías</a>
                <a class="enlaces-paginas" id="enlace-sale">Sale</a>
            </nav>
            <img 
            src="IMAGENES HOME/logo-blanco.png"
            alt="Logo de CUERVO" 
            id="logo-blanco"

            <div id="opciones-cabecera">
                <img src="IMAGENES HOME/icono-lupa.png" alt="buscador" class="iconos-cabecera">
                <img src="IMAGENES HOME/icono-ubicacion.png" alt="ubicacion" class="iconos-cabecera">
                <img src="IMAGENES HOME/icono-cuenta.png" alt="cuenta" class="iconos-cabecera">

            </div>
        </div>
    </header>
  <br>
  <br>
  <br>
  <br>

    <footer>
        <div id="footer">
            <div class="informacion">
                <div class="columna-footer">
                    <h3>NOSOTROS</h3>
                    <a>LOCALES</a>
                    <a>VENTA MAYORISTA</a>
                    <a>VENTA CORPORATIVA</a>
                </div>

                    <a>CONTACTO</a>
                    <a>FORMAS DE PAGO</a>
                    <a>MÉTODOS DE ENVÍO</a>
                </div>

                    <a>TÉRMINOS Y CONDICIONES</a>
                    <a>DEFENSA AL CONSUMIDOR</a>

                </div>
            </div>
        
            <div class="columna-footer">

                <div class="redes-sociales">
                    <a>
                        <img src="IMAGENES HOME/icono-whatsapp.png" alt="whatsapp" class="icono-redes">
                    </a>
                    <a>
                        <img src="IMAGENES HOME/icono-instagram.png" alt="instagram" class="icono-redes">
                    </a>
                    <a>
                        <img src="IMAGENES HOME/icono-facebook.png" alt="facebook" class="icono-redes">
                    </a>
                </div>
            </div>
        </div>
        <img src="IMAGENES HOME/logo-negro.png" alt="Logo de CUERVO" class="logo-negro">
